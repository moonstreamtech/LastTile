name: Android APK & AAB

on:
  # Only push events on protected branches (post-merge into main/master).
  # All feature/bot/PR work runs through the pull_request trigger below
  # so each commit gets exactly one CI run via PR `synchronize`. Listing
  # source branches here too would create a second workflow run on the
  # same SHA — concurrency would cancel one of them and the PR would
  # carry a stale "cancelled" check, blocking mergeable_state.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # Cancel a still-running build when a newer commit lands on the same
  # source branch. With duplicate triggers eliminated above, this block
  # only fires for back-to-back commits (push #2 cancels push #1's CI),
  # so the PR ends up showing only the latest SHA's check.
  group: android-native-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK + release AAB
    runs-on: ubuntu-latest
    # GitHub-hosted ubuntu-latest is a 2-core, 7GB RAM box. The 50-locale
    # AAPT2 compile step kills the runner with the default Gradle heap, so
    # cap the JVM at 5GB and force single-worker execution at the JOB level
    # (gradle.properties also pins these — env wins for daemons spawned by
    # the action setup, properties win for tasks run via gradlew).
    env:
      GRADLE_OPTS: "-Xmx5g -XX:MaxMetaspaceSize=768m -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"
      JAVA_TOOL_OPTIONS: "-Xmx5g"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Decode the real google-services.json from the CI secret and
      # overwrite the committed stub before any Gradle task runs.
      # The stub (project_id = "stub-placeholder") is committed so that
      # local builds compile without the secret; Firebase calls fail
      # gracefully at runtime via UserBootstrap's runCatching wrapper.
      # When the secret IS present (all CI runs in the moonstreamtech org),
      # the real file is used and Firebase Auth + Firestore work correctly.
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d \
              > AndroidBuild/app/google-services.json
            echo "google-services.json decoded from secret."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; using committed stub."
            echo "Firebase Auth and Firestore will be unavailable at runtime."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.14.5"

      # LAYER 3 — pre-build secret check. Validates the three real
      # AdMob ids before any gradle task runs so CI fails fast on
      # missing or misconfigured secrets. The script never echoes
      # secret values; only the variable name and a pass/fail
      # decision are printed.
      - name: Verify release ad ids are real (pre-build)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ secrets.ADMOB_REWARDED_UNIT_ID }}
        run: |
          set -e
          check_id() {
            local name=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "$name: FAIL (empty)"
              exit 1
            fi
            if printf '%s' "$value" | grep -q "3940256099942544"; then
              echo "$name: FAIL (contains test publisher prefix)"
              exit 1
            fi
            echo "$name: PASS"
          }
          check_id ADMOB_APP_ID "$ADMOB_APP_ID"
          check_id ADMOB_BANNER_UNIT_ID "$ADMOB_BANNER_UNIT_ID"
          check_id ADMOB_REWARDED_UNIT_ID "$ADMOB_REWARDED_UNIT_ID"

      - name: Build debug APK
        working-directory: AndroidBuild
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ secrets.ADMOB_REWARDED_UNIT_ID }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace --max-workers=1

      # Android 16 (API 36) migration check — confirms the compiled APK
      # actually carries targetSdkVersion=36, not just that build.gradle.kts
      # says so (a stale AGP cache or wrong variant could silently ship the
      # old value). Remove once the API 36 migration has been live for a
      # few releases and this is no longer a live regression risk.
      - name: Verify targetSdkVersion=36 (aapt dump badging)
        working-directory: AndroidBuild
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -E "targetSdkVersion|compileSdkVersion"
          if ! "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"; then
            echo "FATAL: compiled APK does not report targetSdkVersion=36"
            exit 1
          fi
          echo "targetSdkVersion=36 verified in compiled APK."

      - name: Build release AAB (signed)
        working-directory: AndroidBuild
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ secrets.ADMOB_REWARDED_UNIT_ID }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon --stacktrace --max-workers=1

      - name: Verify release AAB is signed
        working-directory: AndroidBuild
        run: |
          set -e
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "AAB not found at $AAB"
            exit 1
          fi
          # MANIFEST.MF lists per-file digests but no key material — safe
          # to print for diagnostic purposes.
          unzip -p "$AAB" META-INF/MANIFEST.MF | head -20
          # Real signature check: the AAB must contain a signature block
          # (RSA / DSA / EC) and a corresponding .SF file. Without these
          # the bundle is unsigned and Play would refuse the upload.
          if ! unzip -l "$AAB" | grep -E "META-INF/.*\.(RSA|DSA|EC|SF)" ; then
            echo "AAB IS NOT SIGNED"
            exit 1
          fi
          echo "AAB signed: YES"

      # Android 16 (API 36) migration check — Google Play requires 16 KB
      # memory page size support as of Nov 2025 for apps targeting Android
      # 15+. AGP 8.5.1+ page-aligns uncompressed native libraries by default
      # at packaging time, but this confirms it actually happened for the
      # real build output rather than assuming the default held. Checks
      # both the debug APK and the release AAB's base/lib .so entries.
      # Remove once this migration has been live for a few releases.
      - name: Verify 16 KB native library page alignment
        working-directory: AndroidBuild
        run: |
          set -e
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          echo "== debug APK (zipalign -c -P 16) =="
          if unzip -l "$APK" | grep -q '\.so$'; then
            "$ZIPALIGN" -v -c -P 16 4 "$APK"
          else
            echo "No .so entries in debug APK — nothing to check."
          fi

          echo "== release AAB native lib entries (raw offset check) =="
          # zipalign doesn't understand the AAB container format, so check
          # each base/lib/**/*.so entry's zip data offset by hand.
          python3 tools/check_16kb_alignment.py "$AAB"

      # LAYER 4 — post-build content scan. Decompresses the AAB and
      # searches every entry for the test AdMob publisher prefix.
      # If any byte of the bundle still references the test publisher
      # (manifest, BuildConfig, ProGuard map, anything), the build is
      # rejected. This catches a misconfigured release variant that
      # somehow slipped past Layers 1-3.
      - name: Verify release AAB has REAL ad ids (post-build)
        working-directory: AndroidBuild
        run: |
          set -e
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "AAB missing for post-build scan"
            exit 1
          fi
          # Stream every entry of the AAB through grep without
          # extracting to disk. Any match aborts the build.
          if unzip -p "$AAB" '*' | grep -q "3940256099942544"; then
            echo "FATAL: AAB contains test AdMob publisher prefix"
            echo "Release build is using test ids — Play Store would reject."
            exit 1
          fi
          echo "AAB ad ids verified: REAL (no test publisher detected)"

      - name: Stage build outputs
        working-directory: AndroidBuild
        run: |
          set -e
          apk_src="app/build/outputs/apk/debug/app-debug.apk"
          apk_dst="app/build/outputs/apk/debug/lasttile-debug.apk"
          aab_src="app/build/outputs/bundle/release/app-release.aab"
          aab_dst="app/build/outputs/bundle/release/lasttile-release.aab"

          if [ ! -f "$apk_src" ]; then
            echo "Expected debug APK not found at $apk_src"
            exit 1
          fi
          cp "$apk_src" "$apk_dst"

          if [ ! -f "$aab_src" ]; then
            echo "Expected release AAB not found at $aab_src"
            exit 1
          fi
          cp "$aab_src" "$aab_dst"

          ls -la app/build/outputs/apk/debug/
          ls -la app/build/outputs/bundle/release/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lasttile-native-apk
          path: AndroidBuild/app/build/outputs/apk/debug/lasttile-debug.apk
          retention-days: 1
          if-no-files-found: error

      - name: Upload release AAB (signed)
        uses: actions/upload-artifact@v4
        with:
          name: lasttile-release-aab-signed
          path: AndroidBuild/app/build/outputs/bundle/release/lasttile-release.aab
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        run: |
          echo "Debug APK and signed release AAB built."
          echo "Artifacts on this run:"
          echo "  - lasttile-native-apk         (sideload-installable debug APK)"
          echo "  - lasttile-release-aab-signed (Play-uploadable AAB, signed with the upload key)"
          echo "On your phone: enable 'Install unknown apps' for your browser/file manager, then open the APK."
